name: Auto Scan IPTV Sources

on:
  workflow_dispatch: # 允许你在网页端点击手动立即运行
  schedule:
    - cron: '0 2 * * *' # 每天北京时间上午 10 点（UTC 2点）自动运行

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 签出代码库 (Checkout Code)
        uses: actions/checkout@v4

      - name: 2. 配置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装网络请求依赖库
        run: |
          echo "正在升级 pip 并安装 requests..."
          python -m pip install --upgrade pip
          pip install requests
          echo "依赖安装完成。"

      - name: 4. 执行核心扫描与验源脚本
        run: |
          echo "================ 启动 Python 脚本 ================"
          # 使用 python -u 可以强制 Python 标准输出实时打印，不走缓冲区
          python -u scan_new_sources.py
          echo "================ 脚本运行结束 ================"
      - name: 5. 检查并提交生成的新源文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 查看 git 状态，看是否有新生成的 txt 文件
          git status
          
          git add txt/
          
          # 如果没有改动则不提交，有改动则自动提交并推送到仓库
          if git diff --staging --quiet; then
            echo "没有发现更新或新生成的源文件，跳过 Git 提交。"
          else
            git commit -m "Auto-update: 成功扫描并更新 IPTV 源文件 [skip ci]"
            git push
            echo "✅ 更改已成功自动推送到 GitHub 仓库！"
          fi
