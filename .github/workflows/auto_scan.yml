name: Auto Scan IPTV Sources

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点自动运行一次

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许工作流提交并推送代码更改回仓库

    steps:
      - name: 签出代码库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行自动化扫描脚本
        run: |
          python scan_new_sources.py

      - name: 自动提交并推送新生成的源文件到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add txt/
          git diff --staging --quiet || git commit -m "Auto-update: 发现并更新新的 IPTV 源文件"
          git push
