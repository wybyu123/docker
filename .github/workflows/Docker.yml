name: Sync IPTV Image to Docker Hub

on:
  workflow_dispatch: # 支持在网页后台手动点击按钮触发运行

jobs:
  push-to-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 登录到 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. 拉取原作者的镜像（请把下面 akiralereal/iptv:latest 换成你需要同步的原镜像）
      - name: Pull original image
        run: docker pull akiralereal/iptv 

      # 3. 给镜像重新打标签，对准你的 Docker Hub 账号
      - name: Tag image
        run: docker tag akiralereal/iptv  ${{ secrets.DOCKER_USERNAME }}/iptv:latest

      # 4. 推送到你的 Docker Hub 镜像库
      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/iptv:latest
