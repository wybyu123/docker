name: Sync IPTV Image to Docker Hub

on:
  repository_dispatch:
    types: [sync-image] # 监听自定义的触发事件

jobs:
  push-to-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Image Name
        id: image-info
        run: |
          IMAGE_NAME="${{ github.event.client_payload.image_name }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="wjecee/tv-go"
          fi
          echo "target_image=$IMAGE_NAME" >> $GITHUB_OUTPUT
          
          # 自动剥离标签获取纯仓库名
          IMAGE_NO_TAG=$(echo "$IMAGE_NAME" | awk -F':' '{print $1}')
          REPO_NAME=$(echo "$IMAGE_NO_TAG" | awk -F'/' '{print $NF}')
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          
          echo "目标镜像: $IMAGE_NAME, 仓库名: $REPO_NAME"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull original image
        run: docker pull ${{ steps.image-info.outputs.target_image }}

      # 使用 Docker 官方 inspect 获取绝对正确的完整镜像 ID 或直接用全称打标签
      - name: Tag image
        run: |
          SRC_IMAGE="${{ steps.image-info.outputs.target_image }}"
          REPO_NAME="${{ steps.image-info.outputs.repo_name }}"
          TARGET_IMAGE="${{ secrets.DOCKER_USERNAME }}/$REPO_NAME:latest"
          
          echo "正在给 $SRC_IMAGE 打标签为 $TARGET_IMAGE"
          docker tag $SRC_IMAGE $TARGET_IMAGE

      - name: Push image to Docker Hub
        run: |
          REPO_NAME="${{ steps.image-info.outputs.repo_name }}"
          TARGET_IMAGE="${{ secrets.DOCKER_USERNAME }}/$REPO_NAME:latest"
          
          echo "正在推送 $TARGET_IMAGE"
          docker push $TARGET_IMAGE
